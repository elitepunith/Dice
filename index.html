<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    user-scalable=no stops iOS from zooming in when you tap the Roll button,
    which would break the layout. We're already large enough to be readable.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090909" />
  <title>🎲 DICE</title>

  <!--
    Bebas Neue  → tall, condensed display font — great rotated sideways
    DM Mono     → clean monospace for labels, numbers, buttons
  -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <!-- ========================================================
       MOBILE HEADER — replaces the sidebar below 600px
       ======================================================== -->
  <div class="mobile-header" aria-label="App header">
    <div class="mobile-header__title">
      <span>D</span>ICE
    </div>
    <div class="mobile-header__picker" role="group" aria-label="Number of dice">
      <button class="picker-btn active" data-count="1" aria-pressed="true"  onclick="setDiceCount(1)">1</button>
      <button class="picker-btn"        data-count="2" aria-pressed="false" onclick="setDiceCount(2)">2</button>
      <button class="picker-btn"        data-count="3" aria-pressed="false" onclick="setDiceCount(3)">3</button>
    </div>
  </div>

  <!-- ========================================================
       SIDEBAR — desktop only
       ======================================================== -->
  <aside class="sidebar" aria-label="Navigation">
    <div class="sidebar__title" aria-label="Dice app">
      <span>D</span>ICE
    </div>

    <div class="sidebar__picker" role="group" aria-label="Number of dice">
      <span class="sidebar__picker-label">Dice</span>
      <button class="picker-btn active" data-count="1" aria-pressed="true"  onclick="setDiceCount(1)">1</button>
      <button class="picker-btn"        data-count="2" aria-pressed="false" onclick="setDiceCount(2)">2</button>
      <button class="picker-btn"        data-count="3" aria-pressed="false" onclick="setDiceCount(3)">3</button>
    </div>

    <span class="sidebar__version" aria-hidden="true">v2.0</span>
  </aside>

  <!-- ========================================================
       TOP BAR — stats
       ======================================================== -->
  <div class="topbar" role="region" aria-label="Statistics">
    <div class="stat-cell">
      <div class="stat-cell__value" id="statTotal">0</div>
      <div class="stat-cell__label">Rolls</div>
    </div>
    <div class="stat-cell">
      <div class="stat-cell__value" id="statAvg">—</div>
      <div class="stat-cell__label">Avg</div>
    </div>
    <div class="stat-cell">
      <div class="stat-cell__value" id="statBest">—</div>
      <div class="stat-cell__label">Best</div>
    </div>
    <div class="stat-cell">
      <div class="stat-cell__value" id="statLow">—</div>
      <div class="stat-cell__label">Worst</div>
    </div>
    <div class="stat-cell">
      <div class="stat-cell__value" id="statStreak">0</div>
      <div class="stat-cell__label">Streak</div>
    </div>
  </div>

  <!-- ========================================================
       STAGE — total, dice, buttons (the main event)
       ======================================================== -->
  <main class="stage" aria-label="Dice stage">

    <!-- Total display -->
    <div class="total" aria-live="polite" aria-label="Current total">
      <div class="total__label">Total</div>
      <div class="total__value" id="totalValue">—</div>
      <div class="total__tag"   id="totalTag"></div>
    </div>

    <!-- Dice tray -->
    <div class="tray" id="tray" role="group" aria-label="Dice"></div>

    <!-- Roll + Reset buttons -->
    <div class="controls">
      <button class="btn-roll"  id="rollBtn"  onclick="rollAll()">Roll</button>
      <button class="btn-reset" id="resetBtn" onclick="resetEverything()">Reset</button>
    </div>

    <!-- Keyboard shortcuts hint (hidden on touch devices via CSS) -->
    <div class="kbd-hint" aria-hidden="true">
      <span><kbd>Space</kbd> Roll</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Solo</span>
      <span><kbd>R</kbd> Reset</span>
    </div>

  </main>

  <!-- ========================================================
       HISTORY — past rolls pinned to the bottom
       ======================================================== -->
  <footer class="history" role="region" aria-label="Roll history">
    <div class="history__header">
      <span class="history__label">Past rolls</span>
      <button class="history__clear" onclick="clearHistory()">Clear</button>
    </div>
    <div class="history__strip" id="historyStrip" role="list"></div>
  </footer>

</div>

<!-- Toast (errors + events) -->
<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="script.js"></script>
</body>
</html>
